[build-system]
requires = ["setuptools>=45", "wheel", "Cython>=0.29"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbmatrix"
dynamic = ["version"]
description = "Control RGB LED matrices with Raspberry Pi GPIO"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.8"
authors = [
    {name = "Christoph Friedrich", email = "christoph.friedrich@vonaffenfels.de"}
]
maintainers = [
    {name = "Chris Gill", email = "chris@chrisgill.net"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/hzeller/rpi-rgb-led-matrix"
Repository = "https://github.com/hzeller/rpi-rgb-led-matrix"

[tool.setuptools]
packages = ["rgbmatrix"]

[tool.setuptools.package-dir]
rgbmatrix = "bindings/python/rgbmatrix"

[tool.setuptools.dynamic]
version = {attr = "rgbmatrix.__version__"}
